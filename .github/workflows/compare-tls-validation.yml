name: compare-tls-validation
on:
  push:
    branches: [validation/compare-tls-176af35]
permissions:
  contents: read
  actions: read
jobs:
  validate-existing-generated-test-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 176af352bce1e8d543eb6e3f2529a7489b9a0530
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: generated-compare-tls-176af35
          run-id: 44362403435
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/unchanged-test-evidence
      - name: Strict readback of unchanged TLS and negative-control results
        shell: bash
        env:
          RAW: ${{ runner.temp }}/unchanged-test-evidence
          DERIVED: ${{ runner.temp }}/derived-validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          r=pathlib.Path(os.environ['RAW']);out=pathlib.Path(os.environ['DERIVED']);out.mkdir()
          pin='176af352bce1e8d543eb6e3f2529a7489b9a0530'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==pin
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          manifest_sha=hashlib.sha256((r/'SHA256SUMS').read_bytes()).hexdigest()
          assert manifest_sha=='b2862c37643f758c96915d54e61007537cfde3fdf424b42135503794b8192196'
          for line in (r/'SHA256SUMS').read_text().splitlines():
              sha,name=line.split('  ',1);assert pathlib.Path(name).name==name
              assert hashlib.sha256((r/name).read_bytes()).hexdigest()==sha,name
          provenance=(r/'provenance.txt').read_text().splitlines();assert provenance[0]==pin
          source_files=0
          for line in provenance[1:]:
              if len(line)>66 and line[64:66]=='  ' and all(c in '0123456789abcdef'for c in line[:64]):
                  data=subprocess.check_output(['git','show',pin+':'+line[66:]])
                  assert hashlib.sha256(data).hexdigest()==line[:64],line[66:]
                  source_files+=1
          assert source_files>=300
          log=(r/'tls.log').read_text();assert 'test result: ok. 1 passed;'in log
          events=[]
          for line in log.splitlines():
              i=line.find('{')
              if i<0:continue
              try:events.append(json.loads(line[i:]))
              except json.JSONDecodeError:pass
          cases={e['case']:e['success']for e in events if e.get('event')=='tls_case'}
          assert cases=={'verified':True,'wrong_ca':False,'wrong_host':False,'wrong_password':False}
          assert any(e.get('event')=='tls_source_capture'and e.get('success')for e in events)
          assert json.loads((r/'readback.json').read_text())=={'passed':True,'product_pin':pin,'cases':cases}
          assert json.loads((r/'server-settings.json').read_text())['ssl']=='on'
          assert 'hostssl|scram-sha-256'in (r/'hba-auth-methods.txt').read_text()
          inspect=json.loads((r/'final-inspect.json').read_text())[0]
          assert inspect['State']['Running']and not inspect['State']['OOMKilled']and inspect['RestartCount']==0
          assert inspect['HostConfig']['Memory']==1024**3 and inspect['HostConfig']['NanoCpus']==2000000000
          name='compare_event_anchors_real_transaction_witness_and_full_window_coverage'
          baseline=(r/'baseline-event-control.log').read_text()
          assert "thread '"+name+"'"in baseline and 'test result: FAILED. 0 passed; 1 failed;'in baseline
          assert 'comparison.rs:1241:54'in baseline and 'Option::unwrap()'in baseline
          source=pathlib.Path('crates/db-sync-alt/tests/comparison.rs').read_bytes()
          assert hashlib.sha256(source).hexdigest()=='efe3ad1379bf93c463bc93d541bb13566b76818a2c5d6ba6082a241246b780b1'
          assert 'positions["event_hint_queries"].as_u64().unwrap()'in source.decode().splitlines()[1240]
          bp=(r/'baseline-test-only-provenance.txt').read_text()
          assert bp.startswith('f2c896b3d078c6ebf37600a11d911611087c8606\n')
          assert hashlib.sha256(source).hexdigest()in bp
          assert [line for line in bp.splitlines()if line.startswith('diff --git ')]==['diff --git a/crates/db-sync-alt/tests/comparison.rs b/crates/db-sync-alt/tests/comparison.rs']
          assert 'Finished `test` profile'in (r/'baseline-build.log').read_text()
          result={'passed':True,'product_pin':pin,'source_run':44362403435,'source_job':135007030032,'source_artifact':14454532652,'source_ci_status':'failure','tls_test_and_strict_readback':'success','source_files_verified':source_files,'cases':cases,'source_capture':True,'negative_control_named_test_failed':True,'negative_control_source':'f2c896b3d078c6ebf37600a11d911611087c8606','negative_control_missing_field':'positions.event_hint_queries','manifest_sha256':manifest_sha,'reran_tests':False,'wrapper_failure':'Original grep required test name and FAILED on one line; nocapture emits FAILED after its panic on a separate line.'}
          (out/'validation.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compare-tls-derived-readback-176af35
          path: ${{ runner.temp }}/derived-validation
          retention-days: 30
