name: compare-tls-validation
on:
  push:
    branches: [validation/compare-tls-176af35]
permissions:
  contents: read
jobs:
  generated-tls-scram:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_PIN: 176af352bce1e8d543eb6e3f2529a7489b9a0530
      RUST_IMAGE: rust:1.100.0-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
      PG_IMAGE: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 176af352bce1e8d543eb6e3f2529a7489b9a0530
          persist-credentials: false
      - name: Build pinned public CLI test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"/{evidence,cargo,target,pgdata,tls,initdb}
          {
            git rev-parse HEAD
            test "$(git rev-parse HEAD)" = "$PRODUCT_PIN"
            test -z "$(git status --porcelain)"
            git ls-files -z | xargs -0 sha256sum
            uname -a
            free -b
            docker version
          } > "$RUNNER_TEMP/evidence/provenance.txt"
          docker pull "$RUST_IMAGE"
          docker pull "$PG_IMAGE"
          docker image inspect "$RUST_IMAGE" "$PG_IMAGE" > "$RUNNER_TEMP/evidence/images.json"
          docker run --rm --name dsa-tls-build --cpus 2 --memory 3g --memory-swap 3g \
            -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/cargo:/cargo-cache" -v "$RUNNER_TEMP/target:/target" \
            -w /workspace -e CARGO_HOME=/cargo-cache -e CARGO_TARGET_DIR=/target "$RUST_IMAGE" \
            cargo test --locked -p db-sync-alt --test comparison --no-run 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
      - name: Generate local TLS CA and isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj /CN=Generated-Test-CA -addext basicConstraints=critical,CA:TRUE 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj /CN=postgres 2>/dev/null
          printf 'subjectAltName=DNS:postgres\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 2 -extfile server.ext 2>/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout wrong-ca.key -out wrong-ca.crt -days 2 -subj /CN=Generated-Wrong-CA -addext basicConstraints=critical,CA:TRUE 2>/dev/null
          sudo chown 999:999 server.key
          sudo chmod 0600 server.key
          openssl x509 -in server.crt -noout -subject -issuer -ext subjectAltName -fingerprint -sha256 > "$RUNNER_TEMP/evidence/public-certificate.txt"
          cat > "$RUNNER_TEMP/initdb/10-tls-hba.sh" <<'SH'
          #!/bin/sh
          set -eu
          { printf 'hostssl all all all scram-sha-256\n'; cat "$PGDATA/pg_hba.conf"; } > "$PGDATA/pg_hba.next"
          mv "$PGDATA/pg_hba.next" "$PGDATA/pg_hba.conf"
          SH
          chmod 755 "$RUNNER_TEMP/initdb/10-tls-hba.sh"
          docker network create --internal dsa-tls-internal
          docker run -d --name dsa-tls-postgres --network dsa-tls-internal --network-alias postgres --network-alias wrong-host \
            --cpus 2 --memory 1g --memory-swap 1g --shm-size 128m \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=dsa_test \
            -v "$RUNNER_TEMP/pgdata:/var/lib/postgresql/data" -v "$RUNNER_TEMP/tls:/tls:ro" -v "$RUNNER_TEMP/initdb:/docker-entrypoint-initdb.d:ro" "$PG_IMAGE" \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key -c jit=off
          for i in $(seq 1 60); do
            if docker exec dsa-tls-postgres pg_isready -U postgres -d dsa_test; then break; fi
            sleep 1
          done
          docker exec dsa-tls-postgres psql -U postgres -d dsa_test -XAtc "SELECT json_build_object('server_version',version(),'ssl',current_setting('ssl'),'password_encryption',current_setting('password_encryption'),'fsync',current_setting('fsync'))" > "$RUNNER_TEMP/evidence/server-settings.json"
          docker exec dsa-tls-postgres psql -U postgres -d dsa_test -XAtc "SELECT type,auth_method FROM pg_hba_file_rules ORDER BY rule_number" > "$RUNNER_TEMP/evidence/hba-auth-methods.txt"
      - name: Actual converter and compare TLS/SCRAM entrypoints
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --name dsa-tls-test --network dsa-tls-internal --cpus 2 --memory 2g --memory-swap 2g \
            -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/target:/target:ro" -v "$RUNNER_TEMP/tls:/tls:ro" -w /workspace \
            -e 'DSA_TEST_DATABASE=host=postgres user=postgres dbname=dsa_test sslmode=disable' \
            -e DSA_TLS_ROOT_CERT=/tls/ca.crt -e DSA_TLS_WRONG_ROOT_CERT=/tls/wrong-ca.crt "$RUST_IMAGE" \
            sh -ec 'test_binary=$(find /target/debug -type f -executable -name "comparison-*"); test -n "$test_binary"; "$test_binary" compare_cli_tls_reader_files_and_certificate_identity --ignored --exact --nocapture --test-threads=1' \
            2>&1 | tee "$RUNNER_TEMP/evidence/tls.log"
      - name: Strict test readback
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          text=(root/'tls.log').read_text()
          assert 'test result: ok. 1 passed;' in text
          events=[]
          for line in text.splitlines():
              i=line.find('{')
              if i<0:continue
              try:events.append(json.loads(line[i:]))
              except json.JSONDecodeError:pass
          cases={e['case']:e['success'] for e in events if e.get('event')=='tls_case'}
          assert cases=={'verified':True,'wrong_ca':False,'wrong_host':False,'wrong_password':False}
          assert any(e.get('event')=='tls_source_capture' and e.get('success') for e in events)
          (root/'readback.json').write_text(json.dumps({'passed':True,'product_pin':os.environ['PRODUCT_PIN'],'cases':cases},indent=2)+'\n')
          PY
      - name: Show event sampling control fails on the previous operator
        shell: bash
        run: |
          set -euo pipefail
          old_pin=f2c896b3d078c6ebf37600a11d911611087c8606
          git clone --quiet --no-checkout https://github.com/midnight-experiments/db-sync-alt.git "$RUNNER_TEMP/baseline"
          git -C "$RUNNER_TEMP/baseline" checkout --quiet "$old_pin"
          cp crates/db-sync-alt/tests/comparison.rs "$RUNNER_TEMP/baseline/crates/db-sync-alt/tests/comparison.rs"
          {
            git -C "$RUNNER_TEMP/baseline" rev-parse HEAD
            git -C "$RUNNER_TEMP/baseline" diff --stat
            sha256sum crates/db-sync-alt/tests/comparison.rs
            git -C "$RUNNER_TEMP/baseline" diff
          } > "$RUNNER_TEMP/evidence/baseline-test-only-provenance.txt"
          mkdir -p "$RUNNER_TEMP/baseline-target"
          docker run --rm --name dsa-tls-baseline-build --cpus 2 --memory 3g --memory-swap 3g \
            -v "$RUNNER_TEMP/baseline:/workspace:ro" -v "$RUNNER_TEMP/cargo:/cargo-cache" -v "$RUNNER_TEMP/baseline-target:/target" \
            -w /workspace -e CARGO_HOME=/cargo-cache -e CARGO_TARGET_DIR=/target "$RUST_IMAGE" \
            cargo test --locked -p db-sync-alt --test comparison --no-run 2>&1 | tee "$RUNNER_TEMP/evidence/baseline-build.log"
          set +e
          docker run --rm --name dsa-tls-baseline-test --network dsa-tls-internal --cpus 2 --memory 2g --memory-swap 2g \
            -v "$RUNNER_TEMP/baseline:/workspace:ro" -v "$RUNNER_TEMP/baseline-target:/target:ro" -w /workspace \
            -e 'DSA_TEST_DATABASE=host=postgres user=postgres dbname=dsa_test sslmode=disable' "$RUST_IMAGE" \
            sh -ec 'test_binary=$(find /target/debug -type f -executable -name "comparison-*"); test -n "$test_binary"; "$test_binary" compare_event_anchors_real_transaction_witness_and_full_window_coverage --ignored --exact --nocapture --test-threads=1' \
            2>&1 | tee "$RUNNER_TEMP/evidence/baseline-event-control.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          test "$baseline_status" -eq 101
          grep -q 'compare_event_anchors_real_transaction_witness_and_full_window_coverage.*FAILED' "$RUNNER_TEMP/evidence/baseline-event-control.log"
          grep -q 'Option::unwrap()' "$RUNNER_TEMP/evidence/baseline-event-control.log"
          printf '{"expected_failure":true,"exit":101,"source_pin":"%s","test_pin":"%s"}\n' "$old_pin" "$PRODUCT_PIN" > "$RUNNER_TEMP/evidence/baseline-readback.json"
      - name: Preserve measurements
        if: always()
        shell: bash
        run: |
          docker inspect dsa-tls-postgres > "$RUNNER_TEMP/evidence/final-inspect.json" || true
          docker logs --timestamps dsa-tls-postgres > "$RUNNER_TEMP/evidence/postgres.log" 2>&1 || true
          cd "$RUNNER_TEMP/evidence"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-compare-tls-176af35
          path: ${{ runner.temp }}/evidence
          retention-days: 30
      - name: Remove generated scratch and private test keys
        if: always()
        shell: bash
        run: |
          docker rm -f dsa-tls-test dsa-tls-build dsa-tls-baseline-build dsa-tls-baseline-test dsa-tls-postgres || true
          docker network rm dsa-tls-internal || true
          sudo rm -rf -- "$RUNNER_TEMP/pgdata" "$RUNNER_TEMP/tls" "$RUNNER_TEMP/initdb"
