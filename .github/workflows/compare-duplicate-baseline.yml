name: compare-duplicate-baseline
on:
  push:
    branches: [validation/compare-duplicates-fc7513e]
permissions:
  contents: read
jobs:
  demonstrate-old-spent-unit-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_PIN: fc7513e688b4298c2b6ec14592e66150660c1abd
      BASELINE_PIN: 80217349b8ab8267e05a59f8de625fdc887ba0d0
      RUST_IMAGE: rust:1.100.0-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
      PG_IMAGE: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc7513e688b4298c2b6ec14592e66150660c1abd
          persist-credentials: false
      - name: Prepare public baseline with only the regression test overlaid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"/{evidence,cargo,target}
          test "$(git rev-parse HEAD)" = "$PRODUCT_PIN"
          test -z "$(git status --porcelain)"
          git clone --quiet --no-checkout https://github.com/midnight-experiments/db-sync-alt.git "$RUNNER_TEMP/baseline"
          git -C "$RUNNER_TEMP/baseline" checkout --quiet "$BASELINE_PIN"
          cp crates/db-sync-alt/tests/comparison.rs "$RUNNER_TEMP/baseline/crates/db-sync-alt/tests/comparison.rs"
          {
            printf 'product %s\nbaseline %s\n' "$PRODUCT_PIN" "$BASELINE_PIN"
            sha256sum crates/db-sync-alt/tests/comparison.rs
            git -C "$RUNNER_TEMP/baseline" diff
            uname -a
            free -b
          } > "$RUNNER_TEMP/evidence/provenance.txt"
          docker pull "$RUST_IMAGE"
          docker pull "$PG_IMAGE"
          docker image inspect "$RUST_IMAGE" "$PG_IMAGE" > "$RUNNER_TEMP/evidence/images.json"
          docker run --rm --name dsa-duplicate-build --cpus 2 --memory 3g --memory-swap 3g \
            -v "$RUNNER_TEMP/baseline:/workspace:ro" -v "$RUNNER_TEMP/cargo:/cargo-cache" -v "$RUNNER_TEMP/target:/target" \
            -w /workspace -e CARGO_HOME=/cargo-cache -e CARGO_TARGET_DIR=/target "$RUST_IMAGE" \
            cargo test --locked -p db-sync-alt --test comparison --no-run 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
      - name: Run one generated corruption control on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create --internal dsa-duplicate-internal
          docker run -d --name dsa-duplicate-postgres --network dsa-duplicate-internal --network-alias postgres \
            --cpus 2 --memory 1g --memory-swap 1g --shm-size 128m \
            --tmpfs /var/lib/postgresql/data:rw,size=268435456,mode=0700 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=dsa_test "$PG_IMAGE" \
            -c jit=off -c max_wal_size=64MB -c min_wal_size=32MB -c checkpoint_timeout=30s
          for i in $(seq 1 60); do
            if docker exec dsa-duplicate-postgres pg_isready -U postgres -d dsa_test; then break; fi
            sleep 1
          done
          docker exec dsa-duplicate-postgres psql -U postgres -d dsa_test -XAtc "SELECT json_build_object('server_version',version(),'jit',current_setting('jit'),'fsync',current_setting('fsync'),'full_page_writes',current_setting('full_page_writes'),'synchronous_commit',current_setting('synchronous_commit'))" > "$RUNNER_TEMP/evidence/server-settings.json"
          set +e
          docker run --rm --name dsa-duplicate-test --network dsa-duplicate-internal --cpus 2 --memory 2g --memory-swap 2g \
            -v "$RUNNER_TEMP/baseline:/workspace:ro" -v "$RUNNER_TEMP/target:/target:ro" -w /workspace \
            -e 'DSA_TEST_DATABASE=host=postgres user=postgres dbname=dsa_test sslmode=disable' "$RUST_IMAGE" \
            sh -ec 'test_binary=$(find /target/debug -type f -executable -name "comparison-*"); test -n "$test_binary"; "$test_binary" compare_cli_refuses_duplicate_units_on_window_and_old_spent_outputs --ignored --exact --nocapture --test-threads=1' \
            2>&1 | tee "$RUNNER_TEMP/evidence/control.log"
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/evidence/control-exit.txt"
          test "$code" -eq 101
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence';text=(root/'control.log').read_text()
          assert 'test result: FAILED. 0 passed; 1 failed;'in text
          events=[]
          for line in text.splitlines():
              i=line.find('{')
              if i<0:continue
              try:events.append(json.loads(line[i:]))
              except json.JSONDecodeError:pass
          observed={e['kind']:e['exit']for e in events if e.get('event')=='duplicate_asset_unit_cli'}
          assert observed=={'window':1,'old_spent':2},observed
          (root/'validation.json').write_text(json.dumps({'passed':True,'product_test_pin':os.environ['PRODUCT_PIN'],'baseline_source_pin':os.environ['BASELINE_PIN'],'expected_failure_exit':101,'cli_exits':observed,'note':'Old code refuses window duplicates but reports old-spent duplicate rows as answer mismatch2; new product must refuse both1 before native paging.'},indent=2)+'\n')
          PY
      - name: Preserve raw evidence
        if: always()
        shell: bash
        run: |
          docker inspect dsa-duplicate-postgres > "$RUNNER_TEMP/evidence/final-inspect.json" || true
          docker logs --timestamps dsa-duplicate-postgres > "$RUNNER_TEMP/evidence/postgres.log" 2>&1 || true
          cd "$RUNNER_TEMP/evidence"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-duplicate-baseline
          path: ${{ runner.temp }}/evidence
          retention-days: 30
      - name: Remove only generated scratch
        if: always()
        run: |
          docker rm -f dsa-duplicate-build dsa-duplicate-test dsa-duplicate-postgres || true
          docker network rm dsa-duplicate-internal || true
