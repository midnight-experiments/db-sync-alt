name: a7-whole-generated
on:
  push:
    branches: ['validation/a7-whole-conversion']
    paths: ['.github/qualification/config.json']
  workflow_dispatch:
    inputs:
      restore_pair_candidate:
        description: 'Reviewed full product SHA for the authorized retained-generated restore-only pair'
        required: true
        type: string
      restore_pair_mode:
        description: 'Product comparison or explicitly authorized same-c384 owner work_mem control'
        type: choice
        options: [product_pair, owner_work_mem_pair, reader_mode_pair]
        default: product_pair
      restore_pair_continue_run:
        description: 'Optional sealed failed-observer run44933813334; continues work128 only'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pin
        env:
          RESTORE_PAIR_CANDIDATE: ${{ inputs.restore_pair_candidate }}
          RESTORE_PAIR_MODE: ${{ inputs.restore_pair_mode }}
          RESTORE_PAIR_CONTINUE: ${{ inputs.restore_pair_continue_run }}
        run: |
          python3 - <<'PY'
          import json,os,re,sys
          path='.github/qualification/config.json'
          if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
            candidate=os.environ['RESTORE_PAIR_CANDIDATE'];assert re.fullmatch('[0-9a-f]{40}',candidate)
            sys.path.insert(0,'.github/qualification')
            from restore_pair import configuration
            completed=int(os.environ['RESTORE_PAIR_CONTINUE']) if os.environ['RESTORE_PAIR_CONTINUE'] else None
            config=configuration(candidate,os.environ['RESTORE_PAIR_MODE'] or 'product_pair',completed)
            path='.github/qualification/restore-pair-run.json'
            with open(path,'w') as f:json.dump(config,f,indent=2)
          else:config=json.load(open(path))
          assert re.fullmatch('[0-9a-f]{40}',config['source'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DSA_QUALIFICATION_CONFIG='+path+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source='+config['source']+'\npredecessor='+config.get('predecessor','')+'\nreuse='+str(config.get('reuse_run',''))+'\ncontinue='+str(config.get('completed_work4_run') or '')+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{steps.pin.outputs.source}}
          path: product
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.pin.outputs.predecessor != ''
        with:
          ref: ${{steps.pin.outputs.predecessor}}
          path: predecessor
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.pin.outputs.reuse != ''
        with:
          name: a7-whole-generated-${{steps.pin.outputs.reuse}}
          run-id: ${{steps.pin.outputs.reuse}}
          github-token: ${{github.token}}
          path: reuse
      - uses: actions/download-artifact@v4
        if: steps.pin.outputs.continue != ''
        with:
          name: a7-whole-generated-${{steps.pin.outputs.continue}}
          run-id: ${{steps.pin.outputs.continue}}
          github-token: ${{github.token}}
          path: prior
      - name: Generated whole conversion and verified physical backpressure
        run: python3 .github/qualification/run_whole.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a7-whole-generated-${{github.run_id}}
          path: ${{runner.temp}}/whole-evidence
          retention-days: 5
