name: a7-capture-pages-tools
on:
  push:
    branches: [00072-a7-capture-pagination]
    paths: [crates/**, .github/workflows/a7-capture-pages.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    container: rust:1.100.0-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Format candidate and preserve exact patch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rustup show active-toolchain
          cargo fmt --all
          cp "$(rustup which rustfmt)" "$RUNNER_TEMP/rustfmt"
          sha256sum "$RUNNER_TEMP/rustfmt" > "$RUNNER_TEMP/rustfmt.sha256"
          git diff -- crates > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: native-capture-format-patch
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/rustfmt
            ${{ runner.temp }}/rustfmt.sha256
          retention-days: 3
      - name: Require committed formatter output
        run: git diff --exit-code
      - name: Build and qualify isolated native measurement tool
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          export DSA_BENCH_SOURCE_SHA="$(git rev-parse HEAD)"
          cargo fmt --all -- --check
          cargo test --locked -p dsa-store --example a7_capture_pages
          CARGO_PROFILE_RELEASE_DEBUG=0 cargo build --locked --release -p dsa-store --example a7_capture_pages
          CARGO_PROFILE_RELEASE_DEBUG=0 cargo build --locked --release -p db-sync-alt --bin db-sync-alt
          mkdir -p "$RUNNER_TEMP/tool"
          cp "$CARGO_TARGET_DIR/release/examples/a7_capture_pages" "$RUNNER_TEMP/tool/"
          cp "$CARGO_TARGET_DIR/release/db-sync-alt" "$RUNNER_TEMP/tool/"
          "$RUNNER_TEMP/tool/db-sync-alt" convert --help > "$RUNNER_TEMP/tool/convert-help.txt"
          "$RUNNER_TEMP/tool/a7_capture_pages" --self-test > "$RUNNER_TEMP/tool/self-test.json"
          rustc -Vv > "$RUNNER_TEMP/tool/rustc.txt"
          ldd "$RUNNER_TEMP/tool/a7_capture_pages" > "$RUNNER_TEMP/tool/ldd.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/tool/source-head.txt"
          git status --porcelain > "$RUNNER_TEMP/tool/source-status.txt"
          sha256sum crates/dsa-store/src/compare.rs > "$RUNNER_TEMP/tool/native-path.sha256"
          cd "$RUNNER_TEMP/tool"
          sha256sum db-sync-alt convert-help.txt a7_capture_pages self-test.json rustc.txt ldd.txt source-head.txt source-status.txt native-path.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: a7-native-capture-pages
          path: ${{ runner.temp }}/tool
          retention-days: 3
