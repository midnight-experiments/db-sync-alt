version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A version is proposed once it has been published for a week.
    cooldown:
      default-days: 7
    groups:
      # The Pallas crates are pinned to one exact version and move together.
      pallas:
        patterns: ["pallas-*"]
  # The actions of both workflows, pinned by commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The base images of deploy/Dockerfile.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
  # The PostgreSQL image of deploy/compose.yaml. The images of the workflows
  # are the same two, and the public-source check requires that they match.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    # db-sync-alt runs on PostgreSQL 17: only updates within 17 are proposed.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
