version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A version is proposed once it has been published for a week.
    cooldown:
      default-days: 7
    groups:
      # The Pallas crates are pinned to one exact version and move together.
      pallas:
        patterns: ["pallas-*"]
  # The actions of both workflows, pinned by commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The base images of deploy/Dockerfile.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
  # The PostgreSQL image of deploy/compose.yaml. The public-source check
  # requires that the Rust image of the workflows is the one of the Dockerfile
  # and that the Compose server is one of the servers the workflow tests.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    # The bundled server is PostgreSQL 17: only updates within 17 are proposed.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
