[package]
name = "dsa-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
bech32 = "0.11"
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
time = { version = "0.3", features = ["parsing"] }
httpdate = "1"
tokio = { workspace = true, features = ["sync", "time", "net", "io-util"] }

[dev-dependencies]
sha2.workspace = true
flate2 = "1"
pallas-traverse = "=0.33.0"
dsa-chain.workspace = true
clap.workspace = true
hex = "0.4"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
