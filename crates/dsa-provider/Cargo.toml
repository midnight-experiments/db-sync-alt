[package]
name = "dsa-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
dsa-chain.workspace = true
bech32 = "0.11"
bytes = "1"
chrono.workspace = true
hex = "0.4"
httpdate = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
webpki-roots = "1"

[dev-dependencies]
bytes = "1"
dsa-testkit = { path = "../dsa-testkit" }
flate2 = "1"
futures-util = "0.3"
pallas-primitives = "=0.33.0"
pallas-traverse = "=0.33.0"
sha2.workspace = true
tempfile = "3"
