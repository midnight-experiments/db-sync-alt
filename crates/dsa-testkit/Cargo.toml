[package]
name = "dsa-testkit"
description = "Test support: a transaction CBOR builder and a scripted fake provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bech32 = "0.11"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pallas-addresses = "=0.33.0"
pallas-crypto = "=1.4.0"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
dsa-chain.workspace = true
pallas-primitives = "=0.33.0"
pallas-traverse = "=0.33.0"
