[workspace]
members = ["crates/dsa-chain", "crates/dsa-store", "crates/dsa-provider", "crates/dsa-service", "crates/db-sync-alt", "crates/dsa-testkit", "tools/corpus"]
# The corpus tools are built only on request (`-p dsa-corpus-tools` or `--workspace`).
default-members = ["crates/dsa-chain", "crates/dsa-store", "crates/dsa-provider", "crates/dsa-service", "crates/db-sync-alt", "crates/dsa-testkit"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/midnight-experiments/db-sync-alt"

[workspace.dependencies]
dsa-chain = { path = "crates/dsa-chain" }
dsa-store = { path = "crates/dsa-store" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
